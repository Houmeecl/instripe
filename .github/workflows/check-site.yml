name: Revisar sitio (temporal)

on:
  push:
    branches: [claude/sharp-lovelace-ncjp09]
    paths: [.github/workflows/check-site.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el sitio público
        run: |
          for u in https://proveedorregional.cl/health https://www.proveedorregional.cl/health; do
            echo "== $u"
            curl -sS -m 20 -D - "$u" -o body.txt -w 'HTTP %{http_code}\n' || true
            head -c 800 body.txt; echo
          done
          echo "== portada"
          curl -sS -m 20 -o /dev/null -w 'HTTP %{http_code} %{url_effective}\n' -L https://proveedorregional.cl/ || true
