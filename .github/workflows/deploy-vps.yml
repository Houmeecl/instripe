name: Deploy to VPS

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd /var/www/instripe
            test -f package.json
            node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 5)) process.exit(1)"
            pm2 describe instripe >/dev/null
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            npm prune --omit=dev
            pm2 restart instripe --update-env
            HOST=$(grep -E '^BIND_HOST=' .env 2>/dev/null | cut -d= -f2)
            case "$HOST" in ""|0.0.0.0) HOST=127.0.0.1 ;; esac
            PORT=$(grep -E '^PORT=' .env 2>/dev/null | cut -d= -f2)
            for attempt in $(seq 1 10); do
              if curl --fail --silent "http://$HOST:${PORT:-3000}/health" >/dev/null; then
                echo "Deployment healthy at $(date)"
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed after deployment" >&2
            exit 1

