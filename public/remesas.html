<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Remesas</title>
  <style>
    :root {
      --bg: #f3f5fa; --card: #ffffff; --ink: #0e1a3a; --muted: #5d6785; --line: #e2e6f0;
      --brand: #1f5eff; --brand-ink: #ffffff; --brand-soft: #edf2ff; --ok: #14a352; --ok-soft: #e6f6ed;
      --warn: #b7770a; --warn-soft: #fff4dd; --bad: #c62828; --bad-soft: #fdecec; --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { position: sticky; top: 0; z-index: 3; background: var(--card); border-bottom: 1px solid var(--line); }
    .bar { display: flex; align-items: center; gap: 6px; padding: 10px 8px; min-height: 56px; }
    .bar h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 700; text-align: center; }
    .icon-btn { width: 44px; height: 44px; border: 0; background: none; border-radius: 10px; font-size: 22px; color: var(--ink); cursor: pointer; }
    .icon-btn:disabled { visibility: hidden; }
    .steps { display: flex; gap: 4px; padding: 0 16px 10px; }
    .steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
    .steps span.on { background: var(--brand); }
    main { max-width: 520px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    .section { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
    input, select { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #fff; color: var(--ink); }
    input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: var(--brand); }
    input.invalid { border-color: var(--bad); }
    .hint { font-size: 12px; color: var(--bad); min-height: 14px; margin-top: 2px; }
    .btn { display: block; width: 100%; min-height: 52px; padding: 14px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); font: 600 16px system-ui, sans-serif; margin-top: 12px; cursor: pointer; text-align: center; text-decoration: none; }
    .btn.soft { background: var(--brand-soft); color: var(--brand); }
    .btn.ghost { background: #fff; color: var(--muted); border: 1px solid var(--line); }
    .btn:disabled { opacity: .5; cursor: default; }
    .tiles { display: grid; gap: 10px; }
    .tile { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
    .tile .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-size: 22px; flex: none; }
    .tile b { display: block; font-size: 16px; }
    .brand { text-align: center; padding: 18px 0 8px; }
    .brand .logo { font-size: 30px; font-weight: 800; color: var(--brand); letter-spacing: -.02em; }
    .list { margin: 0 -4px; }
    .row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: none; font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
    .row:last-child { border-bottom: 0; }
    .row .flag { font-size: 24px; }
    .row .grow { flex: 1; }
    .row .cur { color: var(--muted); font-size: 13px; }
    .tabs { display: flex; border-bottom: 1px solid var(--line); margin: -4px -16px 8px; }
    .tabs button { flex: 1; min-height: 46px; border: 0; border-bottom: 2px solid transparent; background: none; font: inherit; color: var(--muted); cursor: pointer; }
    .tabs button.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
    .money { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
    .amount-input { font-size: 28px; font-weight: 700; min-height: 60px; }
    .receive { background: var(--brand-soft); border-radius: 12px; padding: 14px; margin-top: 12px; }
    .receive .money { color: var(--brand); }
    .receive .with-flag { display: flex; align-items: center; gap: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
    td { padding: 7px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
    td:last-child { text-align: right; padding-left: 10px; }
    tr.total td { font-weight: 800; border-bottom: 0; padding-top: 10px; font-size: 15px; }
    tr.total td:last-child { color: var(--brand); }
    .chip { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--brand-soft); color: var(--brand); }
    .chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
    .error { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 1em; }
    .center { text-align: center; }
    .check { width: 72px; height: 72px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 40px; display: grid; place-items: center; margin: 6px auto 10px; }
    .pay { text-align: center; padding: 20px 16px 24px; }
    .pay .label { font-size: 18px; font-weight: 600; margin-top: 4px; }
    .pay .money { font-size: 34px; color: var(--brand); margin: 6px 0 18px; }
    .pay svg { width: 120px; height: 120px; }
    .networks { display: flex; justify-content: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .networks span { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); font-weight: 800; font-size: 12px; }
    .networks .visa { color: #1a1f71; } .networks .mc { color: #eb001b; } .networks .rc { color: #fff; background: #d0021b; border-color: #d0021b; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .voucher { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .voucher table { font-size: 12px; }
    #qr { display: flex; justify-content: center; margin: 12px 0 6px; }
    .hidden { display: none !important; }
    @media print { header, .btn, .noprint { display: none !important; } body { background: #fff; } main { padding: 0; } .card { border: 0; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <button class="icon-btn" id="back" aria-label="Volver" disabled>←</button>
      <h1 id="title">Remesas</h1>
      <button class="icon-btn" id="close" aria-label="Inicio" disabled>✕</button>
    </div>
    <div class="steps hidden" id="steps"></div>
  </header>
  <main id="app"><div class="card">Cargando…</div></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const app = document.getElementById("app");
    const titleEl = document.getElementById("title");
    const backBtn = document.getElementById("back");
    const closeBtn = document.getElementById("close");
    const stepsEl = document.getElementById("steps");
    const FLOW = ["country", "beneficiary", "amount", "confirm", "pay", "done"];
    const state = { step: "home", config: null, corridor: null, form: null, quote: null, beneficiary: {}, remitter: {}, sendAmount: 0, remesa: null, tuuPayment: null, trackingUrl: "", tab: "new" };
    const history = [];

    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const clp = (n) => "$" + Number(n || 0).toLocaleString("es-CL");
    const dest = (n, cur) => Number(n || 0).toLocaleString("es-CL", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + esc(cur);
    const flag = (cc) => String(cc || "").toUpperCase().replace(/[A-Z]/g, (c) => String.fromCodePoint(127397 + c.charCodeAt(0)));
    const CHIP = { successful: "ok", sent: "ok", payment_unverified: "warn", pending_review: "warn", payment_failed: "bad", rejected: "bad", transfer_failed: "bad" };
    const LABEL = { awaiting_payment: "Esperando pago", payment_failed: "Pago no aprobado", payment_unverified: "Pago en verificación", pending_review: "En revisión", paid: "Pago aprobado", processing: "Conversión en proceso", sent: "Enviado al banco", successful: "Recibido", rejected: "Rechazado", transfer_failed: "Envío no aceptado" };

    async function api(path, options = {}) {
      const res = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...options, body: options.body ? JSON.stringify(options.body) : undefined });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { const err = new Error(data.error || "Error " + res.status); err.status = res.status; throw err; }
      return data;
    }

    function go(step, push = true) {
      if (push && state.step !== step) history.push(state.step);
      state.step = step;
      render();
    }
    backBtn.onclick = () => { if (history.length) { state.step = history.pop(); render(); } };
    closeBtn.onclick = () => { resetFlow(); history.length = 0; go("home", false); };

    function render() {
      const index = FLOW.indexOf(state.step);
      stepsEl.classList.toggle("hidden", index < 0);
      stepsEl.innerHTML = FLOW.map((_, i) => `<span class="${i <= index ? "on" : ""}"></span>`).join("");
      backBtn.disabled = !history.length || ["done", "pay", "login", "home"].includes(state.step);
      closeBtn.disabled = ["home", "login", "pay"].includes(state.step);
      const views = { login, home, country, beneficiary, amount, confirm, pay, done, history: historyView, settings };
      (views[state.step] || home)();
      window.scrollTo(0, 0);
    }

    function resetFlow() {
      Object.assign(state, { corridor: null, form: null, quote: null, beneficiary: {}, sendAmount: 0, remesa: null, tuuPayment: null, trackingUrl: "", tab: "new" });
    }

    function login(message) {
      titleEl.textContent = "Iniciar sesión";
      app.innerHTML = `<div class="brand"><div class="logo">Remesas</div><div class="muted">Envíos al exterior desde tu POS</div></div>
        <div class="card"><label>Correo</label><input id="email" type="email" autocomplete="username" />
        <label>Clave</label><input id="password" type="password" autocomplete="current-password" />
        <button class="btn" id="go">Entrar</button><div class="error" id="err">${esc(message || "")}</div></div>`;
      document.getElementById("go").onclick = async () => {
        try {
          const r = await api("/api/session", { method: "POST", body: { email: document.getElementById("email").value, password: document.getElementById("password").value } });
          if (r.user.mustChangePassword) { document.getElementById("err").textContent = "Cambia la clave inicial desde el panel antes de operar."; return; }
          await boot();
        } catch (e) { document.getElementById("err").textContent = e.message; }
      };
    }

    // 1. Inicio
    function home() {
      titleEl.textContent = "Remesas";
      app.innerHTML = `<div class="brand"><div class="logo">Remesas</div><div class="muted">Envía dinero al exterior y cobra con tarjeta en el POS</div></div>
        <div class="tiles">
          <button class="tile" id="send"><span class="ico">↗</span><span><b>Enviar dinero</b><span class="muted">${sendable().length} países disponibles</span></span></button>
          <button class="tile" id="hist"><span class="ico">☰</span><span><b>Mis envíos</b><span class="muted">Estado, comprobantes y seguimiento</span></span></button>
          ${state.config.canConfigure ? `<button class="tile" id="cfg"><span class="ico">⚙</span><span><b>Tasas y comisiones</b><span class="muted">Solo Operación</span></span></button>` : ""}
        </div>`;
      document.getElementById("send").onclick = () => { resetFlow(); go("country"); };
      document.getElementById("hist").onclick = () => go("history");
      const cfg = document.getElementById("cfg"); if (cfg) cfg.onclick = () => go("settings");
    }

    // 2. País y moneda (destinos del catálogo de Global66)
    function country() {
      titleEl.textContent = "Enviar dinero";
      const corridors = sendable();
      app.innerHTML = `<div class="card"><input id="q" placeholder="Buscar país…" autocomplete="off" />
        <div class="list" id="list"></div>
        ${corridors.length ? "" : `<p class="muted">No hay países habilitados. Operación tiene que definir las tasas.</p>`}</div>`;
      const list = document.getElementById("list");
      const draw = (filter) => {
        const f = filter.trim().toLowerCase();
        list.innerHTML = corridors.filter((c) => !f || c.countryName.toLowerCase().includes(f) || c.currency.toLowerCase().includes(f))
          .map((c) => `<button class="row" data-cc="${esc(c.country)}"><span class="flag">${flag(c.country)}</span><span class="grow">${esc(c.countryName)}</span><span class="cur">${esc(c.currency)} ›</span></button>`).join("");
        list.querySelectorAll("[data-cc]").forEach((b) => b.onclick = async () => {
          state.corridor = corridors.find((c) => c.country === b.dataset.cc);
          b.disabled = true;
          try {
            state.form = (await api(`/api/remesas/formulario/${encodeURIComponent(state.corridor.country)}`)).form;
            state.beneficiary = { accountType: state.form.accountTypes[0]?.value, documentType: state.form.documents[0]?.value };
            go("beneficiary");
          } catch (e) { b.disabled = false; alert(e.message); }
        });
      };
      draw("");
      document.getElementById("q").oninput = (e) => draw(e.target.value);
    }

    // 3. Datos del beneficiario (formulario de Global66 para la ruta)
    function beneficiary() {
      titleEl.textContent = "Beneficiario";
      const f = state.form, b = state.beneficiary, r = state.remitter;
      const opts = (list, value) => list.map((o) => `<option value="${esc(o.value)}" ${o.value === value ? "selected" : ""}>${esc(o.label)}</option>`).join("");
      const banks = f.banks.length
        ? `<select id="bankId"><option value="">Selecciona el banco</option>${f.banks.map((x) => `<option value="${x.id}" ${String(x.id) === String(b.bankId) ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>`
        : `<input id="bankName" value="${esc(b.bankName)}" />`;
      const extra = f.extraFields.map((x) => `<label>${esc(x.label)}${x.required ? "" : " (opcional)"}</label><input data-extra="${esc(x.field)}" value="${esc((b.extra || {})[x.field])}" maxlength="${x.maxLength || 200}" />`).join("");
      app.innerHTML = `<div class="card"><p class="section">Quien envía</p>
          <div class="pair"><div><label>RUT</label><input id="rrut" value="${esc(r.rut)}" placeholder="12.345.678-9" /></div>
          <div><label>Teléfono</label><input id="rphone" value="${esc(r.phone)}" placeholder="+569…" /></div></div>
          <label>Nombre completo</label><input id="rname" value="${esc(r.name)}" /></div>
        <div class="card"><div class="tabs"><button data-tab="new" class="${state.tab === "new" ? "on" : ""}">Nueva cuenta</button><button data-tab="saved" class="${state.tab === "saved" ? "on" : ""}">Mis beneficiarios</button></div>
          <div id="tab"></div></div>
        <button class="btn" id="next">Continuar</button><div class="error" id="err"></div>`;
      const tab = document.getElementById("tab");
      app.querySelectorAll("[data-tab]").forEach((t) => t.onclick = () => { readForm(); state.tab = t.dataset.tab; beneficiary(); });
      if (state.tab === "saved") {
        tab.innerHTML = `<div class="muted">Cargando…</div>`;
        const rut = document.getElementById("rrut").value;
        if (!rut) tab.innerHTML = `<p class="muted">Ingresa el RUT de quien envía para ver sus beneficiarios.</p>`;
        else api(`/api/remesas/beneficiarios?rut=${encodeURIComponent(rut)}&country=${encodeURIComponent(f.country)}`).then(({ beneficiaries }) => {
          tab.innerHTML = beneficiaries.length ? `<div class="list">${beneficiaries.map((x, i) => `<button class="row" data-i="${i}"><span class="grow"><b>${esc(x.firstName)} ${esc(x.lastName)}</b><br><span class="muted">${esc(x.bankName)} · ••••${esc(String(x.accountNumber).slice(-4))}</span></span><span class="cur">›</span></button>`).join("")}</div>` : `<p class="muted">Este RUT todavía no tiene beneficiarios en ${esc(f.countryName)}.</p>`;
          tab.querySelectorAll("[data-i]").forEach((row) => row.onclick = () => { state.beneficiary = { ...beneficiaries[Number(row.dataset.i)] }; state.tab = "new"; readRemitter(); beneficiary(); });
        }).catch((e) => { tab.innerHTML = `<p class="error">${esc(e.message)}</p>`; });
      } else {
        tab.innerHTML = `<div class="pair"><div><label>Nombre</label><input id="firstName" value="${esc(b.firstName)}" /></div><div><label>Apellido</label><input id="lastName" value="${esc(b.lastName)}" /></div></div>
          <label>Banco</label>${banks}
          <label>Tipo de cuenta</label><select id="accountType">${opts(f.accountTypes, b.accountType)}</select>
          <label>Número de cuenta</label><input id="accountNumber" inputmode="numeric" value="${esc(b.accountNumber)}" />
          <div class="pair"><div><label>Documento</label><select id="documentType">${opts(f.documents.map((d) => ({ value: d.value, label: d.label })), b.documentType)}</select></div>
          <div><label>Número</label><input id="documentNumber" value="${esc(b.documentNumber)}" /></div></div><div class="hint" id="docHint"></div>
          ${extra}`;
        const doc = document.getElementById("documentNumber"), docType = document.getElementById("documentType"), hint = document.getElementById("docHint");
        const checkDoc = () => { const msg = documentProblem(docType.value, doc.value); doc.classList.toggle("invalid", Boolean(msg) && doc.value !== ""); hint.textContent = doc.value ? msg : ""; return !msg; };
        doc.oninput = checkDoc; docType.onchange = checkDoc; if (doc.value) checkDoc();
      }
      document.getElementById("next").onclick = () => {
        readForm();
        const b2 = state.beneficiary, r2 = state.remitter, err = document.getElementById("err");
        const missing = !r2.name || !r2.rut || !b2.firstName || !b2.lastName || !b2.accountNumber || !b2.documentNumber || (f.banks.length ? !b2.bankId : !b2.bankName)
          || f.extraFields.some((x) => x.required && !(b2.extra || {})[x.field]);
        if (missing) { err.textContent = "Completa los datos de quien envía y del beneficiario."; return; }
        const docMsg = documentProblem(b2.documentType, b2.documentNumber);
        if (docMsg) { err.textContent = docMsg; return; }
        go("amount");
      };
    }

    function documentProblem(type, number) {
      const d = state.form.documents.find((x) => x.value === type);
      const n = String(number || "").replace(/[\s.]/g, "");
      if (!d || !n) return "";
      if ((d.minSize && n.length < d.minSize) || (d.maxSize && n.length > d.maxSize)) return `${d.label}: entre ${d.minSize} y ${d.maxSize} caracteres`;
      try { if (d.pattern && !new RegExp(d.pattern).test(n)) return `${d.label}: formato no válido`; } catch { /* keep */ }
      return "";
    }

    function readRemitter() {
      const v = (id) => (document.getElementById(id) || {}).value;
      if (v("rrut") !== undefined) state.remitter = { rut: v("rrut").trim(), phone: v("rphone").trim(), name: v("rname").trim() };
    }

    function readForm() {
      readRemitter();
      const v = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : undefined; };
      if (v("firstName") === undefined) return;
      const extra = {};
      app.querySelectorAll("[data-extra]").forEach((el) => { if (el.value.trim()) extra[el.dataset.extra] = el.value.trim(); });
      const bankId = v("bankId");
      const bank = bankId ? state.form.banks.find((x) => String(x.id) === bankId) : null;
      state.beneficiary = { firstName: v("firstName"), lastName: v("lastName"), bankId: bankId || undefined, bankName: bank ? bank.name : v("bankName"), accountType: v("accountType"), accountNumber: v("accountNumber"), documentType: v("documentType"), documentNumber: v("documentNumber"), extra };
    }

    function breakdown(q) {
      return `<table>
        <tr><td>Tipo de cambio</td><td>${esc(q.rateText)}</td></tr>
        <tr><td>Monto a convertir</td><td>${clp(q.amountToConvert)}</td></tr>
        <tr><td>Costo de conversión</td><td>${clp(q.conversionCost)}</td></tr>
        <tr><td>Cargo de servicio</td><td>${clp(q.serviceFee)}</td></tr>
        <tr><td>Comisión remesa</td><td>${clp(q.commission)}</td></tr>
        <tr><td class="muted">Comisión POS (estimada, la asume el comercio)</td><td class="muted">${clp(q.posFeeEstimated)}</td></tr>
        <tr class="total"><td>Total a pagar</td><td>${clp(q.total)}</td></tr></table>`;
    }

    function receiveBox(q, label = "Tu contacto recibe (estimado)") {
      return `<div class="receive"><div class="muted">${esc(label)}</div><div class="with-flag"><span style="font-size:24px">${flag(q.country)}</span><span class="money">${dest(q.receiveAmount, q.currency)}</span></div>
        ${q.slaHours ? `<div class="muted">Llega en ~${esc(q.slaHours)} h hábiles según Global66</div>` : ""}</div>`;
    }

    // 4. Monto y cotización
    function amount() {
      titleEl.textContent = "Monto a enviar";
      const c = state.corridor;
      app.innerHTML = `<div class="card"><div class="muted">${flag(c.country)} ${esc(c.countryName)} (${esc(c.currency)})</div>
        <label>Tú envías (CLP)</label><input id="amt" class="amount-input" inputmode="numeric" value="${state.sendAmount ? clp(state.sendAmount) : ""}" placeholder="$0" />
        <div class="muted">Mínimo ${clp(c.minAmount)} · máximo ${clp(c.maxAmount)}</div>
        <div id="q"></div></div><button class="btn" id="next" disabled>Continuar</button><div class="error" id="err"></div>`;
      const input = document.getElementById("amt"), box = document.getElementById("q"), next = document.getElementById("next"), err = document.getElementById("err");
      let timer;
      const refresh = async () => {
        const value = Number(input.value.replace(/\D/g, ""));
        state.sendAmount = value; next.disabled = true; err.textContent = "";
        if (!value) { box.innerHTML = ""; return; }
        try {
          const { quote } = await api("/api/remesas/cotizar", { method: "POST", body: { country: c.country, sendAmount: value } });
          state.quote = quote;
          box.innerHTML = receiveBox(quote) + breakdown(quote);
          next.disabled = false;
        } catch (e) { box.innerHTML = ""; err.textContent = e.message; }
      };
      input.oninput = () => {
        const digits = input.value.replace(/\D/g, "");
        input.value = digits ? clp(Number(digits)) : "";
        clearTimeout(timer); timer = setTimeout(refresh, 350);
      };
      if (state.sendAmount) refresh();
      next.onclick = () => go("confirm");
    }

    // 5. Confirmación
    function confirm() {
      titleEl.textContent = "Confirmar envío";
      const q = state.quote, b = state.beneficiary;
      const accountLabel = (state.form.accountTypes.find((x) => x.value === b.accountType) || {}).label || b.accountType;
      app.innerHTML = `<div class="card"><p class="section">Origen</p>
          <table><tr><td>Tú envías</td><td>${clp(q.sendAmount)}</td></tr><tr class="total"><td>Total a pagar</td><td>${clp(q.total)}</td></tr></table></div>
        <div class="card"><p class="section">Destino</p>
          <div class="with-flag" style="display:flex;gap:10px;align-items:center"><span style="font-size:26px">${flag(q.country)}</span>
          <span><b>${esc(b.firstName)} ${esc(b.lastName)}</b><br><span class="muted">${esc(b.bankName)} · ${esc(accountLabel)}<br>Nº ${esc(b.accountNumber)}</span></span></div>
          ${receiveBox(q)}${breakdown(q)}</div>
        <p class="muted">Remitente: ${esc(state.remitter.name)} · RUT ${esc(state.remitter.rut)}. El monto final lo confirma Global66 al convertir.</p>
        <button class="btn" id="pay">Pagar con tarjeta</button><div class="error" id="err"></div>`;
      document.getElementById("pay").onclick = async (e) => {
        e.target.disabled = true;
        try {
          const beneficiaryPayload = { ...state.beneficiary }; delete beneficiaryPayload.id;
          const r = await api("/api/remesas", { method: "POST", body: { country: q.country, sendAmount: q.sendAmount, remitter: state.remitter, beneficiary: beneficiaryPayload } });
          state.remesa = r.remesa; state.tuuPayment = r.tuuPayment; state.trackingUrl = r.trackingUrl;
          history.length = 0; go("pay", false);
        } catch (err) { e.target.disabled = false; document.getElementById("err").textContent = err.message; }
      };
    }

    // 6. Pago con tarjeta: la app Android expone TuuBridge.pay(json) y responde en window.onTuuResult.
    function pay() {
      titleEl.textContent = "Pagar";
      const r = state.remesa, bridge = window.TuuBridge && typeof window.TuuBridge.pay === "function";
      const demo = state.config.settings.tuuVerification === "demo";
      app.innerHTML = `<div class="card pay"><div class="label">Pagar</div><div class="money">${clp(r.quote.total)}</div>
          <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="3" opacity=".25"/>
            <path d="M44 42c8 10 8 26 0 36M54 36c11 13 11 35 0 48M64 30c14 17 14 43 0 60" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
          <p>${bridge ? "Acerca, inserta o desliza la tarjeta" : demo ? "Modo demo: no hay POS conectado" : "Abre esta pantalla desde la app Remesas del POS TUU"}</p>
          <div class="networks"><span class="visa">VISA</span><span class="mc">Mastercard</span><span class="rc">Redcompra</span></div>
          <div class="muted" style="margin-top:12px">Remesa ${esc(r.code)}</div></div>
        ${bridge ? `<button class="btn" id="charge">Cobrar en POS</button>` : demo ? `<button class="btn" id="sim">Simular pago aprobado</button>` : ""}
        <button class="btn ghost" id="cancel">Cancelar</button><div class="error" id="err"></div>`;
      const err = document.getElementById("err");
      const report = async (body) => {
        try { const res = await api(`/api/remesas/${encodeURIComponent(r.id)}/pago`, { method: "POST", body }); state.remesa = res.remesa; go("done", false); }
        catch (e) { err.textContent = e.message; }
      };
      window.onTuuResult = (ok, resultJson, serialNumber) => {
        let result = {};
        try { result = JSON.parse(resultJson || "{}"); } catch { /* keep empty */ }
        if (ok && result.transactionStatus === true) report({ approved: true, sequenceNumber: String(result.sequenceNumber || ""), serialNumber: String(serialNumber || "") });
        else report({ approved: false, errorMessage: result.errorMessageOnApp || result.errorMessage || "Pago cancelado" });
      };
      const charge = document.getElementById("charge");
      if (charge) charge.onclick = () => window.TuuBridge.pay(JSON.stringify(state.tuuPayment));
      const sim = document.getElementById("sim");
      if (sim) sim.onclick = () => report({ approved: true, sequenceNumber: String(Date.now()).slice(-12), serialNumber: "DEMO-POS" });
      document.getElementById("cancel").onclick = () => { history.length = 0; go("home", false); };
    }

    // 7. Envío realizado + comprobante con QR
    function done() {
      const r = state.remesa, failed = ["payment_failed", "transfer_failed", "rejected"].includes(r.status);
      const held = ["pending_review", "payment_unverified"].includes(r.status);
      titleEl.textContent = failed ? "Envío no completado" : "Envío";
      const g = r.global66 || {};
      const last = r.timeline[r.timeline.length - 1] || {};
      const received = { ...r.quote, receiveAmount: g.destinationAmount || r.quote.receiveAmount };
      app.innerHTML = `<div class="card center noprint">${failed || held ? "" : `<div class="check">✓</div>`}
          <div class="money" style="font-size:22px">${failed ? "No se pudo completar" : held ? "Pago recibido, en revisión" : "¡Envío realizado!"}</div>
          <p><span class="chip ${CHIP[r.status] || ""}">${esc(LABEL[r.status] || r.status)}</span></p>
          ${last.detail ? `<p class="muted">${esc(last.detail)}</p>` : ""}
          ${receiveBox(received, g.destinationAmount ? "Tu contacto recibe" : "Tu contacto recibe (estimado)")}
          <p class="muted">Número de operación<br><b style="color:var(--ink)">${esc(r.code)}</b></p></div>
        <button class="btn" id="print">Imprimir voucher</button>
        <button class="btn soft" id="new">Nuevo envío</button>
        <button class="btn ghost" id="refresh">Actualizar estado</button>
        <div class="card voucher" id="voucher" style="margin-top:12px">
          <div class="center"><b>COMPROBANTE DE ENVÍO</b><br>${esc(r.code)}<br>${esc(new Date(r.createdAt).toLocaleString("es-CL"))}</div>
          <p class="section" style="margin-top:12px">Origen</p><table><tr><td>Monto enviado</td><td>${clp(r.quote.sendAmount)}</td></tr><tr><td>Total pagado (tarjeta)</td><td>${clp(r.quote.total)}</td></tr></table>
          <p class="section" style="margin-top:12px">Conversión / costos</p><table><tr><td>Tipo de cambio</td><td>${esc(r.quote.rateText)}</td></tr><tr><td>Monto a convertir</td><td>${clp(r.quote.amountToConvert)}</td></tr><tr><td>Costo de conversión</td><td>${clp(r.quote.conversionCost)}</td></tr><tr><td>Cargo de servicio</td><td>${clp(r.quote.serviceFee)}</td></tr><tr><td>Comisión remesa</td><td>${clp(r.quote.commission)}</td></tr></table>
          <p class="section" style="margin-top:12px">Destino</p><table><tr><td>Beneficiario</td><td>${esc(r.beneficiary.firstName)} ${esc(r.beneficiary.lastName)}</td></tr><tr><td>Banco</td><td>${esc(r.beneficiary.bankName)}</td></tr><tr><td>Cuenta</td><td>••••${esc(String(r.beneficiary.accountNumber).slice(-4))}</td></tr><tr><td>Moneda</td><td>${esc(r.quote.currency)}</td></tr><tr><td>Tu contacto recibe</td><td>${dest(received.receiveAmount, r.quote.currency)}</td></tr></table>
          <p class="section" style="margin-top:12px">Pago</p><table><tr><td>Secuencia TUU</td><td>${esc(r.payment ? r.payment.sequenceNumber : "—")}</td></tr><tr><td>Referencia Global66</td><td>${esc(g.transactionId || "—")}</td></tr><tr><td>Estado</td><td>${esc(LABEL[r.status] || r.status)}</td></tr></table>
          <div id="qr"></div><div class="center muted">Escanea para ver el estado de tu envío</div></div>`;
      if (window.QRCode && state.trackingUrl) new QRCode(document.getElementById("qr"), { text: state.trackingUrl, width: 132, height: 132 });
      document.getElementById("print").onclick = () => window.print();
      document.getElementById("refresh").onclick = async () => {
        try { const res = await api(`/api/remesas/${encodeURIComponent(r.id)}/actualizar`, { method: "POST" }); state.remesa = res.remesa; state.trackingUrl = res.trackingUrl; done(); } catch (e) { alert(e.message); }
      };
      document.getElementById("new").onclick = () => { resetFlow(); history.length = 0; go("country", false); };
    }

    async function historyView() {
      titleEl.textContent = "Mis envíos";
      app.innerHTML = `<div class="card">Cargando…</div>`;
      try {
        const { remesas } = await api("/api/remesas");
        app.innerHTML = `<div class="card list">${remesas.length ? remesas.map((r) => `<button class="row" data-id="${esc(r.id)}"><span class="flag">${flag(r.quote.country)}</span><span class="grow"><b>${esc(r.code)}</b><br><span class="muted">${esc(r.beneficiary.firstName)} ${esc(r.beneficiary.lastName)} · ${clp(r.quote.total)}</span></span><span class="chip ${CHIP[r.status] || ""}">${esc(LABEL[r.status] || r.status)}</span></button>`).join("") : `<p class="muted">Todavía no hay envíos.</p>`}</div>
          <a class="btn soft" href="/api/remesas/export">Descargar CSV para contabilidad</a>`;
        app.querySelectorAll("[data-id]").forEach((b) => b.onclick = async () => {
          const res = await api(`/api/remesas/${encodeURIComponent(b.dataset.id)}`);
          state.remesa = res.remesa; state.tuuPayment = res.tuuPayment; state.trackingUrl = res.trackingUrl;
          if (res.remesa.status === "awaiting_payment") go("pay");
          else if (["pending_review", "payment_unverified"].includes(res.remesa.status) && state.config.canConfigure) { go("done"); addApprove(); }
          else go("done");
        });
      } catch (e) { app.innerHTML = `<div class="card error">${esc(e.message)}</div>`; }
    }

    function addApprove() {
      const r = state.remesa;
      const box = document.createElement("div");
      box.innerHTML = `<button class="btn" id="approve">Aprobar y enviar por Global66</button><div class="error" id="aerr"></div>`;
      app.prepend(box);
      document.getElementById("approve").onclick = async () => {
        try { const res = await api(`/api/remesas/${encodeURIComponent(r.id)}/aprobar`, { method: "POST" }); state.remesa = res.remesa; done(); }
        catch (e) { document.getElementById("aerr").textContent = e.message; }
      };
    }

    function settings() {
      titleEl.textContent = "Tasas y comisiones";
      const s = state.config.settings;
      app.innerHTML = `<div class="card"><p class="muted">Destinos y bancos: catálogo de Global66. Verificación TUU: <b>${esc(s.tuuVerification)}</b> · Global66: <b>${esc(s.global66)}</b> · Remitente (RaaS): <b>${s.raas ? "sí" : "no"}</b></p>
        <p class="muted">Tasa = CLP por 1 unidad de la moneda de destino. Porcentajes en decimal (0.03 = 3 %). La tasa la carga Operación hasta que Global66 habilite su API de cotización.</p>
        <input id="q" placeholder="Buscar país…" /></div><div id="rows"></div>`;
      const rows = document.getElementById("rows");
      const draw = (filter) => {
        const f = filter.trim().toLowerCase();
        rows.innerHTML = state.config.corridors.filter((c) => !f || c.countryName.toLowerCase().includes(f) || c.currency.toLowerCase().includes(f)).map((c) => `<div class="card" data-cc="${esc(c.country)}">
          <b>${flag(c.country)} ${esc(c.countryName)} · ${esc(c.currency)}</b> ${c.available ? "" : `<span class="chip bad">Fuera del catálogo</span>`}
          <div class="pair"><div><label>Tasa (CLP)</label><input name="rate" inputmode="decimal" value="${esc(c.rate)}" /></div><div><label>Costo conversión</label><input name="conversionPct" inputmode="decimal" value="${esc(c.conversionPct)}" /></div></div>
          <div class="pair"><div><label>Comisión remesa</label><input name="commissionPct" inputmode="decimal" value="${esc(c.commissionPct)}" /></div><div><label>Comisión fija (CLP)</label><input name="commissionFixed" inputmode="numeric" value="${esc(c.commissionFixed)}" /></div></div>
          <label><input type="checkbox" name="enabled" ${c.enabled ? "checked" : ""} style="width:auto;min-height:0"> Habilitado</label>
          <button class="btn soft">Guardar</button><div class="error"></div><div class="muted">${c.rateUpdatedAt ? "Tasa actualizada " + esc(new Date(c.rateUpdatedAt).toLocaleString("es-CL")) : "Sin tasa"} · Global66 USD ${esc(c.minUsd)}–${esc(Number(c.maxUsd).toLocaleString("es-CL"))}</div></div>`).join("");
        rows.querySelectorAll("[data-cc]").forEach((card) => {
          card.querySelector("button").onclick = async () => {
            const f2 = (n) => card.querySelector(`[name=${n}]`);
            try {
              await api(`/api/remesas/corredores/${encodeURIComponent(card.dataset.cc)}`, { method: "PUT", body: { rate: f2("rate").value, conversionPct: f2("conversionPct").value, commissionPct: f2("commissionPct").value, commissionFixed: f2("commissionFixed").value, enabled: f2("enabled").checked } });
              state.config = await api("/api/remesas/config");
              card.querySelector(".error").style.color = "var(--ok)"; card.querySelector(".error").textContent = "Guardado";
            } catch (e) { card.querySelector(".error").style.color = ""; card.querySelector(".error").textContent = e.message; }
          };
        });
      };
      draw("");
      document.getElementById("q").oninput = (e) => draw(e.target.value);
    }

    const sendable = () => state.config.corridors.filter((c) => c.available && c.enabled && c.rate > 0);

    async function boot() {
      try {
        state.config = await api("/api/remesas/config");
        history.length = 0; go("home", false);
      } catch (e) {
        state.step = "login"; render(); login(e.status === 401 ? "" : e.message);
      }
    }
    boot();
  </script>
</body>
</html>
